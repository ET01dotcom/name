<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>บันทึกข้อมูลการผลิต</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#5fb35d; --green-d:#4a9d48; --green-l:#e8f5e6;
    --ink:#24493a; --mut:#8aa39a; --line:#dfe9e1; --bg:#eef7ef;
    --card:#ffffff; --red:#e5484d; --red-l:#fdeaea;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    font-family:'Noto Sans Thai',system-ui,sans-serif;
    background:radial-gradient(circle at 0 0,#dff2dc 0,transparent 40%),
               radial-gradient(circle at 100% 100%,#e4f3e0 0,transparent 40%),var(--bg);
    color:var(--ink);min-height:100vh;padding:12px 12px 32px;
  }
  .wrap{max-width:560px;margin:0 auto}
  .topbar{
    display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;
    padding:10px 12px;box-shadow:0 2px 12px rgba(60,120,70,.07);margin-bottom:12px;
  }
  .logo{font-weight:800;font-size:22px;color:var(--green);letter-spacing:.5px}
  .logo small{display:block;font-size:10px;color:#7a4b2a;font-weight:600;letter-spacing:0}
  .card{background:var(--card);border-radius:22px;box-shadow:0 6px 24px rgba(60,120,70,.09);overflow:hidden}
  .head{display:flex;align-items:center;gap:14px;padding:18px 18px 16px;background:linear-gradient(135deg,#eef8ec,#fbfdfb);border-bottom:1px solid var(--line)}
  .head-icon{width:52px;height:52px;border-radius:16px;background:var(--green);display:grid;place-items:center;flex:none}
  .head h1{margin:0;font-size:18px;font-weight:700}
  .head p{margin:2px 0 0;font-size:12px;color:var(--mut)}
  .body{padding:8px 18px 18px}
  .row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
  .row:last-child{border-bottom:none}
  .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;font-size:20px}
  .lbl{width:110px;flex:none;font-size:14px;font-weight:600;line-height:1.3}
  .lbl small{display:block;font-weight:400;color:var(--mut);font-size:11px}
  .ctrl{flex:1;min-width:0}
  input[type=text],input[type=number],input[type=date],input[type=time],textarea{
    width:100%;height:46px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;
    font:inherit;font-size:15px;color:var(--ink);background:#fbfdfb;outline:none;
  }
  input:focus{border-color:var(--green)}
  input::placeholder{color:#b3c4bb}
  .suffix{position:relative}
  .suffix span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:14px;pointer-events:none}
  .suffix input{padding-right:36px}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .seg input{display:none}
  .seg label{
    height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:6px;
    font-weight:600;font-size:15px;background:#eef2f0;color:#5a6f66;cursor:pointer;transition:.15s;
  }
  .seg input:checked + label{background:linear-gradient(180deg,var(--green),var(--green-d));color:#fff;box-shadow:0 4px 12px rgba(74,157,72,.3)}
  .radios{display:flex;flex-direction:column;gap:6px;padding-top:4px}
  .radio{display:flex;align-items:center;gap:12px;cursor:pointer;padding:6px 0;font-size:15px}
  .radio input{display:none}
  .radio .dot{width:24px;height:24px;border-radius:50%;border:2px solid #c5d3cb;display:grid;place-items:center;flex:none;transition:.15s}
  .radio input:checked + .dot{border-color:var(--green)}
  .radio input:checked + .dot::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--green)}
  .other{margin-top:6px;display:none}
  .other.show{display:block}
  .photos-drop{
    border:2px dashed #cfe3cf;border-radius:16px;padding:12px;display:flex;align-items:center;gap:12px;
    cursor:pointer;background:#fbfefb;
  }
  .photos-drop:active{background:var(--green-l)}
  .thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .thumb{position:relative;aspect-ratio:1/1;border-radius:14px;overflow:hidden;background:#eee}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb button{
    position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:none;
    background:rgba(20,40,30,.7);color:#fff;font-size:13px;line-height:22px;cursor:pointer;padding:0;
  }
  .add-tile{
    aspect-ratio:1/1;border-radius:14px;border:2px dashed #cfe3cf;display:flex;flex-direction:column;
    align-items:center;justify-content:center;color:var(--green-d);font-size:12px;font-weight:600;cursor:pointer;background:#fbfefb;
  }
  .add-tile b{font-size:26px;line-height:1;font-weight:400}
  .hint{font-size:12px;color:var(--mut);margin-top:8px}
  .divider{height:1px;background:var(--line);margin:10px 0}
  .submit{
    margin-top:18px;width:100%;height:54px;border:none;border-radius:18px;cursor:pointer;
    background:linear-gradient(180deg,var(--green),var(--green-d));color:#fff;font:inherit;font-size:17px;font-weight:700;
    box-shadow:0 8px 20px rgba(74,157,72,.3);display:flex;align-items:center;justify-content:center;gap:10px;
  }
  .submit:disabled{opacity:.6;cursor:not-allowed}
  .spinner{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;display:none}
  .loading .spinner{display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:#24493a;color:#fff;
    padding:12px 18px;border-radius:14px;font-size:14px;transition:transform .3s;max-width:90%;text-align:center;z-index:10
  }
  .toast.show{transform:translate(-50%,0)}
  .toast.err{background:var(--red)}
  .field-err{border-color:var(--red)!important;background:var(--red-l)!important}
  @media (max-width:420px){
    .lbl{width:88px;font-size:13px}
    .ico{width:38px;height:38px;font-size:18px}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="logo">graco<small>ภาชนะเพื่อชีวิตปลอดภัย</small></div>
  </div>

  <div class="card">
    <div class="head">
      <div class="head-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="#fff"><path d="M2 20V9l5 3V9l5 3V6l5 3v11H2zm17 0V4h3v16h-3z"/></svg>
      </div>
      <div>
        <h1>บันทึกข้อมูลการผลิต</h1>
        <p>บันทึกงาน / คุณภาพ / รูปภาพ</p>
      </div>
    </div>

    <form class="body" id="form" autocomplete="off" novalidate>

      <!-- วันที่ -->
      <div class="row">
        <div class="ico" style="background:#e4f4e2">📅</div>
        <div class="lbl">วันที่ :</div>
        <div class="ctrl"><input type="date" id="date" required></div>
      </div>

      <!-- กะ -->
      <div class="row">
        <div class="ico" style="background:#fff6d6">☀️</div>
        <div class="lbl">กะ :</div>
        <div class="ctrl seg">
          <input type="radio" name="shift" id="shift-morning" value="เช้า" checked>
          <label for="shift-morning">☀ เช้า</label>
          <input type="radio" name="shift" id="shift-night" value="ดึก">
          <label for="shift-night">🌙 ดึก</label>
        </div>
      </div>

      <!-- เวลา -->
      <div class="row">
        <div class="ico" style="background:#ece8fd">🕒</div>
        <div class="lbl">เวลา :</div>
        <div class="ctrl"><input type="time" id="time" required></div>
      </div>

      <!-- จำนวน -->
      <div class="row">
        <div class="ico" style="background:#e2f3e0">📦</div>
        <div class="lbl">จำนวน <small>(ชิ้น)</small></div>
        <div class="ctrl"><input type="number" id="total" inputmode="numeric" min="0" placeholder="จำนวน (ชิ้น)"></div>
      </div>

      <!-- จำนวนเสีย -->
      <div class="row">
        <div class="ico" style="background:#fde3e3">✖️</div>
        <div class="lbl">จำนวนเสีย :</div>
        <div class="ctrl"><input type="number" id="defect" inputmode="numeric" min="0" placeholder="จำนวน (ชิ้น)"></div>
      </div>

      <!-- เปอร์เซ็นต์ -->
      <div class="row">
        <div class="ico" style="background:#dcefff">%</div>
        <div class="lbl">เปอร์เซ็นต์ของเสีย :</div>
        <div class="ctrl suffix">
          <input type="number" id="defectPct" inputmode="decimal" step="0.01" min="0" placeholder="เช่น 2.5">
          <span>%</span>
        </div>
      </div>

      <div class="divider"></div>

      <!-- โหมด -->
      <div class="row" style="align-items:flex-start">
        <div class="ico" style="background:#e4f4e2">🗂️</div>
        <div class="lbl" style="padding-top:4px">โหมด :</div>
        <div class="ctrl">
          <div class="radios" id="modes">
            <label class="radio"><input type="radio" name="mode" value="ติดร้าวทะลุ" checked><span class="dot"></span>ติดร้าวทะลุ</label>
            <label class="radio"><input type="radio" name="mode" value="ชอบแตกบน"><span class="dot"></span>ชอบแตกบน</label>
            <label class="radio"><input type="radio" name="mode" value="เชื่อเน่า"><span class="dot"></span>เชื่อเน่า</label>
            <label class="radio"><input type="radio" name="mode" value="จุดดำ"><span class="dot"></span>จุดดำ</label>
            <label class="radio"><input type="radio" name="mode" value="อื่นๆ"><span class="dot"></span>อื่นๆ</label>
          </div>
          <div class="other" id="otherBox">
            <input type="text" id="modeOther" placeholder="ระบุเพิ่มเติม...">
          </div>
        </div>
      </div>

      <div class="divider"></div>

      <!-- รูปภาพ -->
      <div class="row" style="align-items:flex-start;flex-direction:column;align-items:stretch">
        <div style="display:flex;align-items:center;gap:12px">
          <div class="ico" style="background:#ece8fd">📷</div>
          <div class="lbl">แนบรูป :</div>
        </div>
        <div style="margin-top:10px">
          <label class="photos-drop" id="pickBtn">
            <div class="ico" style="background:#e9efeb;width:46px;height:46px">🖼️</div>
            <div>
              <div style="font-weight:600;font-size:14px">อัปโหลดรูปภาพ</div>
              <div style="font-size:12px;color:var(--mut)">(ประมาณ 3-5 รูป)</div>
            </div>
            <input type="file" id="fileInput" accept="image/*" multiple hidden>
          </label>
          <div class="thumbs" id="thumbs"></div>
          <div class="hint" id="photoCount">0 รูป (สูงสุด 5 รูป)</div>
        </div>
      </div>

      <button type="submit" class="submit" id="submitBtn">
        <span class="spinner"></span>
        <span id="submitText">➤ บันทึกข้อมูล</span>
      </button>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ====== ตั้งค่า ====== */
const CONFIG = {
  API_URL: "PASTE_APPS_SCRIPT_WEB_APP_URL_HERE", // URL จากการ Deploy Google Apps Script
  MAX_PHOTOS: 5,
  MIN_PHOTOS: 1,
  IMG_MAX_SIDE: 1280,   // ย่อรูปก่อนส่ง เพื่อให้ไฟล์เล็ก
  IMG_QUALITY: 0.8
};

const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor?.('#eef8ec'); }

const MODE_OTHER_VALUE = "อื่นๆ";
const $ = (id) => document.getElementById(id);
let photos = []; // [{file, url}]

/* ====== ค่าเริ่มต้น: วันที่/เวลาตามเขตเวลาไทย ====== */
(function initDefaults(){
  const now = new Date();
  $('date').value = now.toLocaleDateString('en-CA', { timeZone: 'Asia/Bangkok' });
  $('time').value = now.toLocaleTimeString('en-GB', { timeZone: 'Asia/Bangkok', hour: '2-digit', minute: '2-digit' });
})();

/* ====== คำนวณเปอร์เซ็นต์อัตโนมัติ ====== */
function recalcPct(){
  const total = parseFloat($('total').value);
  const defect = parseFloat($('defect').value);
  if (total > 0 && !isNaN(defect)) {
    $('defectPct').value = ((defect / total) * 100).toFixed(2);
  }
}
$('total').addEventListener('input', recalcPct);
$('defect').addEventListener('input', recalcPct);

/* ====== โหมด "อื่นๆ" ====== */
document.querySelectorAll('input[name=mode]').forEach(r => {
  r.addEventListener('change', () => {
    const isOther = document.querySelector('input[name=mode]:checked').value === MODE_OTHER_VALUE;
    $('otherBox').classList.toggle('show', isOther);
    if (isOther) $('modeOther').focus();
  });
});

/* ====== รูปภาพ ====== */
$('fileInput').addEventListener('change', (e) => {
  const files = Array.from(e.target.files || []);
  const room = CONFIG.MAX_PHOTOS - photos.length;
  if (files.length > room) toast(`เพิ่มได้อีก ${room} รูปเท่านั้น`, true);
  files.slice(0, room).forEach(f => {
    if (!f.type.startsWith('image/')) return;
    photos.push({ file: f, url: URL.createObjectURL(f) });
  });
  e.target.value = '';
  renderThumbs();
});

function renderThumbs(){
  const box = $('thumbs');
  box.innerHTML = '';
  photos.forEach((p, i) => {
    const d = document.createElement('div');
    d.className = 'thumb';
    d.innerHTML = `<img src="${p.url}" alt=""><button type="button" aria-label="ลบรูป">✕</button>`;
    d.querySelector('button').onclick = () => {
      URL.revokeObjectURL(p.url);
      photos.splice(i, 1);
      renderThumbs();
    };
    box.appendChild(d);
  });
  if (photos.length < CONFIG.MAX_PHOTOS) {
    const add = document.createElement('label');
    add.className = 'add-tile';
    add.innerHTML = `<b>+</b>เพิ่มรูป`;
    add.onclick = () => $('fileInput').click();
    box.appendChild(add);
  }
  $('photoCount').textContent = `${photos.length} รูป (สูงสุด ${CONFIG.MAX_PHOTOS} รูป)`;
}
renderThumbs();

/* ย่อรูปแล้วแปลงเป็น base64 (JPEG) */
function compressImage(file){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, CONFIG.IMG_MAX_SIDE / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const dataUrl = c.toDataURL('image/jpeg', CONFIG.IMG_QUALITY);
      URL.revokeObjectURL(img.src);
      resolve(dataUrl.split(',')[1]); // ตัด prefix data:image/jpeg;base64,
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

/* ====== ตรวจความถูกต้อง ====== */
function validate(){
  const errs = [];
  const fields = [
    ['date', $('date').value],
    ['time', $('time').value],
    ['total', $('total').value],
    ['defect', $('defect').value],
  ];
  fields.forEach(([id, v]) => {
    const bad = v === '' || v === null;
    $(id).classList.toggle('field-err', bad);
    if (bad) errs.push(id);
  });
  if ($('total').value !== '' && +$('total').value <= 0) { $('total').classList.add('field-err'); errs.push('total'); }
  if (+$('defect').value > +$('total').value && $('total').value !== '') {
    $('defect').classList.add('field-err'); errs.push('defect');
  }
  const mode = document.querySelector('input[name=mode]:checked').value;
  if (mode === MODE_OTHER_VALUE && !$('modeOther').value.trim()) {
    $('modeOther').classList.add('field-err'); errs.push('modeOther');
  }
  if (photos.length < CONFIG.MIN_PHOTOS) errs.push('photos');
  return errs;
}

/* ====== ส่งข้อมูล ====== */
function setLoading(on){
  $('submitBtn').disabled = on;
  $('submitBtn').classList.toggle('loading', on);
  $('submitText').textContent = on ? 'กำลังบันทึก...' : '➤ บันทึกข้อมูล';
}

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  document.querySelectorAll('.field-err').forEach(el => el.classList.remove('field-err'));

  const errs = validate();
  if (errs.length) {
    const msg = errs.includes('photos') && errs.length === 1
      ? `กรุณาแนบรูปอย่างน้อย ${CONFIG.MIN_PHOTOS} รูป`
      : 'กรุณากรอกข้อมูลให้ครบถ้วนและถูกต้อง';
    toast(msg, true);
    tg?.HapticFeedback?.notificationOccurred('error');
    return;
  }

  setLoading(true);
  try {
    const mode = document.querySelector('input[name=mode]:checked').value;
    const shift = document.querySelector('input[name=shift]:checked').value;
    const images = [];
    for (const p of photos) images.push(await compressImage(p.file));

    const payload = {
      date: $('date').value,
      shift,
      time: $('time').value,
      total: +$('total').value,
      defect: +$('defect').value,
      defectPct: $('defectPct').value === '' ? null : +$('defectPct').value,
      mode,
      modeOther: mode === MODE_OTHER_VALUE ? $('modeOther').value.trim() : '',
      images,
      // ข้อมูลผู้ใช้จาก Telegram (ใช้ตรวจสอบฝั่ง server ได้)
      initData: tg?.initData || '',
      userId: tg?.initDataUnsafe?.user?.id ?? null,
      userName: tg?.initDataUnsafe?.user?.first_name ?? ''
    };

    const res = await fetch(CONFIG.API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // หลีกเลี่ยง CORS preflight
      body: JSON.stringify(payload)
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'บันทึกไม่สำเร็จ');

    tg?.HapticFeedback?.notificationOccurred('success');
    toast('บันทึกข้อมูลเรียบร้อย ✓');
    resetForm();
    if (tg) setTimeout(() => tg.close(), 1200);
  } catch (err) {
    console.error(err);
    tg?.HapticFeedback?.notificationOccurred('error');
    toast('เกิดข้อผิดพลาด: ' + err.message, true);
  } finally {
    setLoading(false);
  }
});

function resetForm(){
  $('total').value = '';
  $('defect').value = '';
  $('defectPct').value = '';
  $('modeOther').value = '';
  $('otherBox').classList.remove('show');
  document.querySelector('input[name=mode]').checked = true;
  photos.forEach(p => URL.revokeObjectURL(p.url));
  photos = [];
  renderThumbs();
}

/* ====== Toast ====== */
let toastTimer;
function toast(msg, isErr = false){
  const t = $('toast');
  t.textContent = msg;
  t.classList.toggle('err', isErr);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}
</script>
</body>
</html>
