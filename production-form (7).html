<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>บันทึกข้อมูลการผลิต</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #f4f6f9;
    --surface: #ffffff;
    --surface-2: #f1f5f9;
    --border: #dbe2ea;
    --text: #0f172a;
    --muted: #64748b;
    --primary: #2563eb;
    --primary-text: #ffffff;
    --success: #059669;
    --success-hover: #047857;
    --ring: #3b82f6;
    --critical: #dc2626;
    --radius: 14px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Noto Sans Thai", "Sarabun", "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- Header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .back {
    width: 36px; height: 36px; border-radius: 50%;
    border: none; background: transparent; color: var(--text);
    display: grid; place-items: center; cursor: pointer;
  }
  .title { flex: 1; min-width: 0; }
  .title h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .title p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }

  /* ---------- Orb ---------- */
  .orb-wrap {
    width: 48px; height: 48px; position: relative; flex: none;
    display: grid; place-items: center;
  }
  .orb-wrap canvas { display: block; }

  /* ---------- Chat area ---------- */
  main {
    padding: 16px 12px 120px;
    max-width: 640px;
    margin: 0 auto;
  }
  .row { display: flex; gap: 8px; align-items: flex-start; }
  .bot-dot {
    width: 36px; height: 36px; border-radius: 50%; flex: none;
    background: var(--primary); display: grid; place-items: center; color: #fff;
    margin-top: 4px;
  }
  .bubble {
    flex: 1; min-width: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    border-top-left-radius: 4px;
    overflow: hidden;
  }
  .bubble-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
  }
  .bubble-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .bubble-head time { font-size: 12px; color: var(--muted); }

  .section { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .section:last-child { border-bottom: none; }

  .field {
    display: grid;
    grid-template-columns: 110px 1fr;
    gap: 10px;
    align-items: center;
    margin-bottom: 12px;
  }
  .field:last-child { margin-bottom: 0; }
  .label {
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; color: var(--text); font-weight: 500;
  }
  .label svg { width: 18px; height: 18px; flex: none; color: var(--muted); }
  .mini-orb { width: 22px; height: 22px; flex: none; display: inline-grid; place-items: center; }
  .mini-orb canvas { display: block; }

  .input-wrap { position: relative; }
  input[type="text"], input[type="number"], input[type="date"], input[type="time"] {
    width: 100%;
    height: 42px;
    padding: 0 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font: inherit;
    font-size: 14px;
    outline: none;
    color-scheme: light;
  }
  input::placeholder { color: var(--muted); }
  input:focus { border-color: var(--ring); box-shadow: 0 0 0 3px rgba(77,163,255,.2); }
  input[readonly] { opacity: .85; }
  .suffix {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    color: var(--muted); font-size: 13px; pointer-events: none;
  }
  .has-suffix input { padding-right: 36px; }

  /* Shift toggle */
  .segmented { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .segmented > div { position: relative; }
  .segmented input { position: absolute; opacity: 0; pointer-events: none; }
  .segmented label {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    height: 40px; border-radius: 10px; cursor: pointer;
    background: var(--surface-2); color: var(--muted);
    font-size: 14px; border: 1px solid transparent;
    transition: background .2s, color .2s;
  }
  .segmented input:checked + label {
    background: var(--primary); color: var(--primary-text);
  }
  .segmented input:focus-visible + label { box-shadow: 0 0 0 3px rgba(77,163,255,.4); }

  /* Defect mode */
  .modes { position: relative; display: flex; flex-direction: column; gap: 10px; }
  .think-orb {
    position: absolute; right: 0; top: 50%; transform: translateY(-50%);
    width: 120px; height: 120px; pointer-events: none;
    display: grid; place-items: center;
  }
  .think-orb canvas { display: block; }
  .mode {
    position: relative;
    display: flex; align-items: center; gap: 10px;
    font-size: 14px; cursor: pointer;
  }
  .mode input { position: absolute; opacity: 0; pointer-events: none; }
  .radio {
    width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid var(--muted); flex: none;
    display: grid; place-items: center;
    transition: border-color .15s;
  }
  .radio::after {
    content: ""; width: 10px; height: 10px; border-radius: 50%;
    background: var(--primary); transform: scale(0); transition: transform .15s;
  }
  .mode input:checked + .radio { border-color: var(--primary); }
  .mode input:checked + .radio::after { transform: scale(1); }
  .mode input:focus-visible + .radio { box-shadow: 0 0 0 3px rgba(77,163,255,.4); }
  .other-input { margin-left: 30px; margin-top: 2px; }
  .other-input[hidden] { display: none; }

  /* Photos */
  .dropzone {
    position: relative;
    border: 1.5px dashed var(--border);
    border-radius: 12px;
    padding: 18px 12px;
    text-align: center;
    cursor: pointer;
    background: var(--surface-2);
    transition: border-color .15s;
    display: block;
  }
  .dropzone:hover, .dropzone:focus-within { border-color: var(--ring); }
  .dropzone input { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; }
  .dropzone .big { font-size: 14px; font-weight: 500; }
  .dropzone .small { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .thumbs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 10px;
  }
  .thumb {
    position: relative; aspect-ratio: 1 / 1; border-radius: 10px; overflow: hidden;
    background: var(--surface-2);
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb button {
    position: absolute; top: 4px; right: 4px;
    width: 22px; height: 22px; border-radius: 50%;
    border: none; background: rgba(0,0,0,.7); color: #fff;
    display: grid; place-items: center; cursor: pointer; font-size: 13px; line-height: 1;
  }
  .thumb-add {
    position: relative;
    aspect-ratio: 1 / 1; border-radius: 10px;
    border: 1.5px dashed var(--border);
    display: grid; place-items: center; cursor: pointer;
    color: var(--muted); font-size: 12px; text-align: center; background: var(--surface-2);
  }
  .thumb-add:focus-within { border-color: var(--ring); }
  .thumb-add input { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; }
  .thumb-add span { display: block; font-size: 22px; line-height: 1; color: var(--text); }
  .photo-count { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .photo-count.error { color: var(--critical); }

  /* Submit */
  .submit-bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: var(--surface);
    border-top: 1px solid var(--border);
  }
  .submit {
    width: 100%; height: 48px; border: none; border-radius: 12px;
    background: var(--success); color: #fff;
    font: inherit; font-size: 15px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    cursor: pointer; transition: background .15s, opacity .15s;
  }
  .submit:hover { background: var(--success-hover); }
  .submit:disabled { opacity: .6; cursor: not-allowed; }
  .submit:focus-visible { outline: 3px solid rgba(16,185,129,.5); outline-offset: 2px; }

  .toast {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
    background: var(--surface-2); border: 1px solid var(--border);
    padding: 10px 16px; border-radius: 10px; font-size: 14px;
    opacity: 0; pointer-events: none; transition: opacity .2s;
    max-width: calc(100% - 32px);
  }
  .toast.show { opacity: 1; }
  .toast.error { border-color: var(--critical); color: #b91c1c; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <button class="back" type="button" aria-label="ย้อนกลับ" id="backBtn">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="title">
    <h1>บันทึกข้อมูลการผลิต</h1>
    <p>บันทึกงาน / คุณภาพ / รูปภาพ</p>
  </div>
  <div class="orb-wrap" id="orb" role="img" aria-label="สถานะ: พร้อมใช้งาน"></div>
</header>

<main>
  <div class="row">
    <div class="bot-dot" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h8M8 9h2"/></svg>
    </div>
    <section class="bubble" aria-labelledby="formTitle">
      <div class="bubble-head">
        <h2 id="formTitle">กรอกข้อมูลการผลิต</h2>
        <time id="now">--:--</time>
      </div>

      <form id="prodForm" novalidate>
        <!-- Basic info -->
        <div class="section">
          <div class="field">
            <label class="label" for="date">
              <span class="mini-orb" data-state="listening" aria-hidden="true"></span>
              วันที่
            </label>
            <div class="input-wrap"><input type="date" id="date" required /></div>
          </div>

          <div class="field">
            <div class="label" id="shiftLabel">
              <span class="mini-orb" data-state="reasoning" aria-hidden="true"></span>
              กะ
            </div>
            <div class="segmented" role="radiogroup" aria-labelledby="shiftLabel">
              <div>
                <input type="radio" name="shift" id="shiftDay" value="day" checked />
                <label for="shiftDay">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                  เช้า
                </label>
              </div>
              <div>
                <input type="radio" name="shift" id="shiftNight" value="night" />
                <label for="shiftNight">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                  บ่าย/ดึก
                </label>
              </div>
            </div>
          </div>

          <div class="field">
            <label class="label" for="time">
              <span class="mini-orb" data-state="tool-call" aria-hidden="true"></span>
              เวลา
            </label>
            <div class="input-wrap"><input type="time" id="time" required /></div>
          </div>

          <div class="field">
            <label class="label" for="good">
              <span class="mini-orb" data-state="done" aria-hidden="true"></span>
              งานดี
            </label>
            <div class="input-wrap has-suffix">
              <input type="number" id="good" inputmode="numeric" min="0" step="1" placeholder="จำนวน (ชิ้น)" />
              <span class="suffix">ชิ้น</span>
            </div>
          </div>

          <div class="field">
            <label class="label" for="bad">
              <span class="mini-orb" data-state="error" aria-hidden="true"></span>
              งานเสีย
            </label>
            <div class="input-wrap has-suffix">
              <input type="number" id="bad" inputmode="numeric" min="0" step="1" placeholder="จำนวน (ชิ้น)" />
              <span class="suffix">ชิ้น</span>
            </div>
          </div>

          <div class="field">
            <label class="label" for="percent">
              <span class="mini-orb" data-state="tool-result" aria-hidden="true"></span>
              เปอร์เซ็นต์ของเสีย
            </label>
            <div class="input-wrap has-suffix">
              <input type="number" id="percent" inputmode="decimal" min="0" max="100" step="0.1" placeholder="เช่น 2.5" readonly />
              <span class="suffix">%</span>
            </div>
          </div>
        </div>

        <!-- Defect mode -->
        <div class="section">
          <div class="field" style="grid-template-columns: 110px 1fr; align-items: start;">
            <div class="label" id="modeLabel">
              <span class="mini-orb" data-state="thinking" aria-hidden="true"></span>
              โหมด
            </div>
            <div class="modes" role="radiogroup" aria-labelledby="modeLabel">
              <span class="think-orb" id="thinkOrb" aria-hidden="true"></span>
              <label class="mode"><input type="radio" name="mode" value="ตูดร้าวทะลุ" /><span class="radio"></span>ตูดร้าวทะลุ</label>
              <label class="mode"><input type="radio" name="mode" value="ขอบแตกบน" /><span class="radio"></span>ขอบแตกบน</label>
              <label class="mode"><input type="radio" name="mode" value="เยื่อเน่า" /><span class="radio"></span>เยื่อเน่า</label>
              <label class="mode"><input type="radio" name="mode" value="จุดดำ" /><span class="radio"></span>จุดดำ</label>
              <label class="mode"><input type="radio" name="mode" value="อื่นๆ" id="modeOther" /><span class="radio"></span>อื่นๆ</label>
              <div class="input-wrap other-input" id="otherWrap" hidden>
                <input type="text" id="otherText" placeholder="ระบุเพิ่มเติม..." aria-label="ระบุโหมดอื่นๆ" />
              </div>
            </div>
          </div>
        </div>

        <!-- Photos -->
        <div class="section">
          <div class="field" style="grid-template-columns: 110px 1fr; align-items: start;">
            <div class="label" id="photoLabel">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
              แนบรูป
            </div>
            <div>
              <label class="dropzone" id="dropzone">
                <input type="file" id="photoInput" accept="image/*" multiple aria-labelledby="photoLabel" />
                <div class="big">อัปโหลดรูปภาพ</div>
                <div class="small">(เลือกได้หลายรูป)</div>
              </label>

              <div class="thumbs" id="thumbs"></div>
              <div class="photo-count" id="photoCount">0 รูป (3-5 รูป)</div>
            </div>
          </div>
        </div>
      </form>
    </section>
  </div>
</main>

<div class="submit-bar" id="submitBar">
  <button class="submit" type="button" id="submitBtn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    บันทึกข้อมูล
  </button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =========================================================
   CONFIG
   ========================================================= */
const CONFIG = {
  // ใส่ URL ของ backend ที่รับข้อมูล (POST multipart/form-data)
  // ถ้าเว้นว่าง จะส่งข้อมูลกลับบอทด้วย Telegram.WebApp.sendData (ไม่รวมรูปภาพ)
  // วาง URL ของ Web app จาก Google Apps Script (ลงท้ายด้วย /exec)
  API_URL: "https://script.google.com/macros/s/AKfycbxBMZ4-UL-vDSqvHIlgNXhp8lszCTny82G8v4kEjVR3XCtaRSr3acVsRY_DsIM--tjL9Q/exec",
  MIN_PHOTOS: 1,
  MAX_PHOTOS: Infinity,
  ORB_SETTLE_MS: 5000,
};

/* =========================================================
   TELEGRAM SETUP
   ========================================================= */
const tg = window.Telegram?.WebApp;

if (tg) {
  tg.ready();
  tg.expand();
  document.body.classList.add("tg");
  tg.setHeaderColor?.("#ffffff");
  tg.setBackgroundColor?.("#f4f6f9");
  tg.BackButton?.onClick(() => tg.close());
  tg.BackButton?.show();
}

document.getElementById("backBtn").addEventListener("click", () => {
  if (tg) tg.close(); else history.back();
});

/* =========================================================
   ORB — dotted 3D shapes that morph between agent states
   Palette: white + light green (#86efac), amber for approval, red for error
   ========================================================= */
const NEUTRAL = "#1e293b";
const ACCENT = "#16a34a";
const AMBER = "#f59e0b";
const RED = "#ef4444";
const YELLOW = "#eab308";
// Mostly dark dots with an occasional yellow one
const THINK_COLORS = [NEUTRAL, NEUTRAL, NEUTRAL, NEUTRAL, NEUTRAL, NEUTRAL, YELLOW];
const ORB_LABELS = {
  idle: "พร้อมใช้งาน", listening: "กำลังกรอกข้อมูล", thinking: "กำลังคิด",
  reasoning: "กำลังตรวจสอบ", "tool-call": "กำลังอัปโหลดรูป", "tool-result": "กำลังรับผลลัพธ์",
  streaming: "กำลังส่งข้อมูล", "waiting-approval": "รอการยืนยัน", done: "บันทึกสำเร็จ", error: "เกิดข้อผิดพลาด",
};

const VISUALS = {
  idle:              { shape: "ring",    axis: "z", speed: 0.35, color: NEUTRAL, brightness: 0.8, settles: true,  paused: false },
  listening:         { shape: "sphere",  axis: "y", speed: 0.8,  color: ACCENT,  pulse: 0.04,    settles: true,  paused: false },
  thinking:          { shape: "scatter", axis: "y", speed: 1.2,  color: NEUTRAL, colors: THINK_COLORS, jitter: 0.05, settles: false, paused: false },
  reasoning:         { shape: "sphere",  axis: "y", speed: 1.6,  color: ACCENT,  settles: false, paused: false },
  "tool-call":       { shape: "sphere",  axis: "y", speed: 1.1,  color: NEUTRAL, brightness: 0.6, settles: false, paused: false },
  "tool-result":     { shape: "network", axis: "y", speed: 0.9,  color: ACCENT,  settles: false, paused: false },
  streaming:         { shape: "sphere",  axis: "y", speed: 1.0,  color: ACCENT,  wave: true,      settles: false, paused: false },
  "waiting-approval":{ shape: "ring",    axis: "z", speed: 0.7,  color: AMBER,   settles: true,  paused: false },
  done:              { shape: "ring",    axis: "z", speed: 0.3,  color: ACCENT,  brightness: 0.95, settles: true, paused: false },
  error:             { shape: "ring",    axis: "z", speed: 0,    color: RED,     settles: false, paused: true },
};

const NPTS = 100;
const NODES = 26;
const GOLDEN = Math.PI * (3 - Math.sqrt(5));

function fibSphere(n, r) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const y = 1 - (2 * (i + 0.5)) / n;
    const rad = Math.sqrt(1 - y * y);
    const th = GOLDEN * i;
    out.push([Math.cos(th) * rad * r, y * r, Math.sin(th) * rad * r]);
  }
  return out;
}

function ringPts(n, r) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const a = (2 * Math.PI * i) / n;
    out.push([Math.cos(a) * r, Math.sin(a) * r, 0]);
  }
  return out;
}

// Deterministic random so the scatter looks the same on every load
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

function cloudPts(n, r) {
  const out = [];
  while (out.length < n) {
    const x = rnd() * 2 - 1, y = rnd() * 2 - 1, z = rnd() * 2 - 1;
    if (x * x + y * y + z * z <= 1) out.push([x * r, y * r, z * r]);
  }
  return out;
}

// Thinking: faint sphere outline plus scattered dots of varying depth
function shellPts(n) {
  const out = [];
  while (out.length < n) {
    const x = rnd() * 2 - 1, y = rnd() * 2 - 1, z = rnd() * 2 - 1;
    const l = Math.hypot(x, y, z);
    if (l < 0.2 || l > 1) continue;
    const r = 0.35 + 0.55 * rnd();
    out.push([(x / l) * r, (y / l) * r, (z / l) * r]);
  }
  return out;
}

const SHAPES = {
  scatter: () => [...fibSphere(30, 0.95), ...shellPts(NPTS - 30)],
  ring: () => ringPts(NPTS, 0.92),
  sphere: () => fibSphere(NPTS, 0.9),
  cloud: () => cloudPts(NPTS, 0.9),
  network: () => [
    ...fibSphere(NODES, 0.9),
    ...cloudPts(NPTS - NODES, 0.9).map(([x, y, z]) => {
      const l = Math.hypot(x, y, z) || 1;
      return [(x / l) * 0.9, (y / l) * 0.9, (z / l) * 0.9];
    }),
  ],
};

function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  const clamped = Math.max(0, Math.min(1, a));
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${clamped.toFixed(3)})`;
}

class Orb {
  constructor(el, size = 48, state = "idle", persistent = false) {
    this.el = el;
    this.size = size;
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.canvas = document.createElement("canvas");
    this.canvas.width = size * this.dpr;
    this.canvas.height = size * this.dpr;
    this.canvas.style.width = size + "px";
    this.canvas.style.height = size + "px";
    el.appendChild(this.canvas);
    this.ctx = this.canvas.getContext("2d");

    this.reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    this.shape = "ring";
    this.target = SHAPES.ring();
    this.pos = this.target.map((p) => [...p]);
    this.v = VISUALS.idle;
    this.state = "idle";
    this.t = 0;
    this.frozen = false;
    this.settleTimer = null;

    this.persistent = persistent;
    this.set(state);
    this.loop = this.loop.bind(this);
    requestAnimationFrame(this.loop);
  }

  set(state) {
    const v = VISUALS[state];
    if (!v) return;
    clearTimeout(this.settleTimer);
    this.state = state;
    this.v = v;
    this.frozen = false;
    if (v.shape !== this.shape) {
      this.shape = v.shape;
      this.target = SHAPES[v.shape]();
    }
    if (v.settles && !this.persistent) {
      this.settleTimer = setTimeout(() => { this.frozen = true; }, CONFIG.ORB_SETTLE_MS);
    }
    this.el.setAttribute("aria-label", "สถานะ: " + ORB_LABELS[state]);
  }

  loop() {
    const v = this.v;
    if (!this.frozen && !this.reduced && !v.paused) {
      this.t += (1 / 60) * v.speed;
    }
    // Morph current points toward the target shape
    const k = this.reduced ? 1 : 0.07;
    for (let i = 0; i < this.pos.length; i++) {
      const p = this.pos[i], q = this.target[i];
      p[0] += (q[0] - p[0]) * k;
      p[1] += (q[1] - p[1]) * k;
      p[2] += (q[2] - p[2]) * k;
    }
    this.draw();
    requestAnimationFrame(this.loop);
  }

  draw() {
    const { ctx, size, dpr, v, pos, t } = this;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, size, size);

    const cx = size / 2, cy = size / 2;
    const R = size * 0.42;
    const rot = this.reduced ? 0 : t * 0.9;
    const tilt = 0.35;
    const cosR = Math.cos(rot), sinR = Math.sin(rot);
    const cosT = Math.cos(tilt), sinT = Math.sin(tilt);
    const pulse = v.pulse ? 1 + Math.sin(t * 2) * v.pulse : 1;
    const isRing = v.axis === "z";
    const brightness = v.brightness ?? 1;

    const projected = pos.map((p, i) => {
      let [x, y, z] = p;
      if (v.jitter) {
        x += Math.sin(t * 2 + i) * v.jitter;
        y += Math.cos(t * 1.7 + i * 1.3) * v.jitter;
        z += Math.sin(t * 2.3 + i * 0.7) * v.jitter;
      }
      let X, Y, Z;
      if (isRing) {
        X = x * cosR - y * sinR;
        Y = x * sinR + y * cosR;
        Z = 0;
      } else {
        X = x * cosR + z * sinR;
        const z1 = -x * sinR + z * cosR;
        Y = y * cosT - z1 * sinT;
        Z = y * sinT + z1 * cosT;
      }
      const depth = (Z + 1) / 2;
      let alpha;
      if (isRing) {
        alpha = 0.3 + 0.7 * ((X + 1) / 2);
      } else if (v.wave) {
        const band = 0.5 + 0.5 * Math.sin(y * 5 - t * 3);
        alpha = 0.3 + 0.7 * (0.5 * depth + 0.5 * band);
      } else if (this.shape === "scatter") {
        alpha = i < 30 ? 0.1 + 0.1 * depth : 0.3 + 0.7 * depth;
      } else if (this.shape === "network") {
        alpha = i < NODES ? 0.45 + 0.55 * depth : 0.12 + 0.2 * depth;
      } else {
        alpha = 0.25 + 0.75 * depth;
      }
      return {
        i,
        color: v.colors ? v.colors[i % v.colors.length] : v.color,
        X: X * pulse,
        Y: Y * pulse,
        Z,
        alpha: alpha * brightness,
        r: Math.max(
          (isRing ? size * 0.03 : size * 0.03 * (0.6 + 0.6 * depth)) *
            (this.shape === "scatter" ? 0.6 + 0.9 * (((i * 37) % 10) / 10) : 1),
          0.8
        ),
      };
    });

    // Network edges between nearby nodes
    if (this.shape === "network") {
      const nodes = projected.slice(0, NODES);
      ctx.lineWidth = 0.6;
      for (let a = 0; a < nodes.length; a++) {
        for (let b = a + 1; b < nodes.length; b++) {
          const A = nodes[a], B = nodes[b];
          const d = Math.hypot(A.X - B.X, A.Y - B.Y, A.Z - B.Z);
          if (d < 0.75) {
            ctx.strokeStyle = hexA(v.color, 0.28 * brightness);
            ctx.beginPath();
            ctx.moveTo(cx + A.X * R, cy - A.Y * R);
            ctx.lineTo(cx + B.X * R, cy - B.Y * R);
            ctx.stroke();
          }
        }
      }
    }

    // Draw back-to-front so near dots sit on top
    if (!isRing) projected.sort((a, b) => a.Z - b.Z);
    for (const d of projected) {
      ctx.beginPath();
      ctx.fillStyle = hexA(d.color, d.alpha);
      ctx.arc(cx + d.X * R, cy - d.Y * R, d.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

const orb = new Orb(document.getElementById("orb"));

// Animated mini orbs replace the label icons
document.querySelectorAll(".mini-orb").forEach((el) => {
  new Orb(el, 22, el.dataset.state, true);
});
new Orb(document.getElementById("thinkOrb"), 120, "thinking", true);

/* =========================================================
   FORM STATE
   ========================================================= */
const $ = (id) => document.getElementById(id);
const goodEl = $("good"), badEl = $("bad"), pctEl = $("percent");
const dateEl = $("date"), timeEl = $("time");
const photoInput = $("photoInput");
const thumbsEl = $("thumbs");
const photoCountEl = $("photoCount");
const otherWrap = $("otherWrap"), otherText = $("otherText");
const submitBtn = $("submitBtn");
const toastEl = $("toast");

let photos = []; // { file, url }

function tickClock() {
  const d = new Date();
  $("now").textContent = d.toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" });
}
tickClock();
setInterval(tickClock, 30_000);

// default date (Bangkok)
const bkk = new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Bangkok" }));
dateEl.value = `${bkk.getFullYear()}-${String(bkk.getMonth() + 1).padStart(2, "0")}-${String(bkk.getDate()).padStart(2, "0")}`;

function updatePercent() {
  const good = parseInt(goodEl.value, 10) || 0;
  const bad = parseInt(badEl.value, 10) || 0;
  const total = good + bad;
  pctEl.value = total > 0 ? ((bad / total) * 100).toFixed(1) : "";
}
goodEl.addEventListener("input", updatePercent);
badEl.addEventListener("input", updatePercent);

document.querySelectorAll('input[name="mode"]').forEach((r) => {
  r.addEventListener("change", () => {
    const showOther = $("modeOther").checked;
    otherWrap.hidden = !showOther;
    if (showOther) otherText.focus();
  });
});

/* =========================================================
   PHOTOS
   ========================================================= */
function renderPhotos() {
  thumbsEl.innerHTML = "";
  photos.forEach((p, i) => {
    const wrap = document.createElement("div");
    wrap.className = "thumb";
    const img = document.createElement("img");
    img.src = p.url;
    img.alt = `รูปที่ ${i + 1}`;
    const btn = document.createElement("button");
    btn.type = "button";
    btn.setAttribute("aria-label", `ลบรูปที่ ${i + 1}`);
    btn.textContent = "✕";
    btn.addEventListener("click", () => removePhoto(i));
    wrap.append(img, btn);
    thumbsEl.appendChild(wrap);
  });

  if (photos.length < CONFIG.MAX_PHOTOS) {
    const add = document.createElement("label");
    add.className = "thumb-add";
    add.innerHTML = `<div><span>+</span>เพิ่มรูป</div>`;
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";
    input.multiple = true;
    input.setAttribute("aria-label", "เพิ่มรูป");
    input.addEventListener("change", (e) => addFiles(e.target.files));
    add.appendChild(input);
    thumbsEl.appendChild(add);
  }

  const n = photos.length;
  photoCountEl.textContent = `${n} รูป`;
  photoCountEl.classList.toggle("error", n > 0 && n < CONFIG.MIN_PHOTOS);
}

function addFiles(fileList) {
  const files = Array.from(fileList || []).filter((f) => f.type.startsWith("image/"));
  const room = CONFIG.MAX_PHOTOS - photos.length;
  if (files.length > room) toast(`เพิ่มได้สูงสุด ${CONFIG.MAX_PHOTOS} รูป`, true);
  files.slice(0, room).forEach((file) => {
    photos.push({ file, url: URL.createObjectURL(file) });
  });
  photoInput.value = "";
  renderPhotos();
}

function removePhoto(i) {
  URL.revokeObjectURL(photos[i].url);
  photos.splice(i, 1);
  renderPhotos();
}

photoInput.addEventListener("change", (e) => addFiles(e.target.files));
renderPhotos();

/* =========================================================
   VALIDATION & SUBMIT
   ========================================================= */
function toast(msg, isError = false) {
  toastEl.textContent = msg;
  toastEl.classList.toggle("error", isError);
  toastEl.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove("show"), 2600);
}

function getFormData() {
  const shift = document.querySelector('input[name="shift"]:checked')?.value ?? "day";
  const modeInput = document.querySelector('input[name="mode"]:checked');
  let mode = modeInput?.value ?? "";
  if (mode === "อื่นๆ") mode = otherText.value.trim() || "อื่นๆ";
  return {
    date: dateEl.value,
    shift,
    time: timeEl.value,
    good: parseInt(goodEl.value, 10) || 0,
    bad: parseInt(badEl.value, 10) || 0,
    defect_percent: pctEl.value ? parseFloat(pctEl.value) : null,
    mode,
    photo_count: photos.length,
  };
}

function validate() {
  const d = getFormData();
  const modeChecked = document.querySelector('input[name="mode"]:checked');
  if (!d.date) return "กรุณาเลือกวันที่";
  if (!d.time) return "กรุณาเลือกเวลา";
  if (goodEl.value === "" && badEl.value === "") return "กรุณากรอกจำนวนงานดีหรืองานเสีย";
  if (!modeChecked) return "กรุณาเลือกโหมด";
  if (modeChecked.value === "อื่นๆ" && !otherText.value.trim()) return "กรุณาระบุโหมดอื่นๆ";
  if (photos.length < CONFIG.MIN_PHOTOS) return `กรุณาแนบรูปอย่างน้อย ${CONFIG.MIN_PHOTOS} รูป`;
  return null;
}

/** Downscale and compress a photo to a base64 JPEG so the request stays small. */
async function toJpegBase64(file, maxSide = 1280, quality = 0.75) {
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, maxSide / Math.max(bitmap.width, bitmap.height));
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(bitmap.width * scale);
  canvas.height = Math.round(bitmap.height * scale);
  canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  bitmap.close?.();
  return canvas.toDataURL("image/jpeg", quality).split(",")[1];
}

async function submit() {
  const err = validate();
  if (err) {
    orb.set("error");
    toast(err, true);
    return;
  }

  setBusy(true);
  orb.set("thinking");
  const data = getFormData();

  try {
    if (CONFIG.API_URL) {
      orb.set("tool-call");
      const images = [];
      for (const p of photos) images.push(await toJpegBase64(p.file));
      orb.set("streaming");
      // text/plain avoids a CORS preflight; the server parses the JSON body itself
      const res = await fetch(CONFIG.API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ ...data, photos: images, init_data: tg?.initData || "" }),
      });
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || "บันทึกไม่สำเร็จ");
    } else if (tg?.sendData) {
      // sendData จำกัดขนาด 4096 bytes และไม่รองรับไฟล์ จึงส่งเฉพาะข้อมูล
      orb.set("streaming");
      tg.sendData(JSON.stringify(data));
      return;
    } else {
      // โหมดทดสอบในเบราว์เซอร์
      orb.set("reasoning");
      await new Promise((r) => setTimeout(r, 900));
    }

    orb.set("done");
    toast("บันทึกข้อมูลสำเร็จ");
    tg?.HapticFeedback?.notificationOccurred("success");
  } catch (e) {
    console.error(e);
    orb.set("error");
    toast("บันทึกไม่สำเร็จ: " + (e.message || e), true);
    tg?.HapticFeedback?.notificationOccurred("error");
  } finally {
    setBusy(false);
  }
}

function setBusy(busy) {
  submitBtn.disabled = busy;
  if (tg?.MainButton) {
    if (busy) tg.MainButton.showProgress(false);
    else tg.MainButton.hideProgress();
  }
}

submitBtn.addEventListener("click", submit);

// Telegram native MainButton (replaces the in-page button inside Telegram only).
// telegram-web-app.js also loads in a normal browser, so check for real initData.
const inTelegram = Boolean(tg?.initData);
if (inTelegram && tg.MainButton) {
  tg.MainButton.setText("บันทึกข้อมูล");
  tg.MainButton.color = "#10b981";
  tg.MainButton.textColor = "#ffffff";
  tg.MainButton.onClick(submit);
  tg.MainButton.show();
  $("submitBar").style.display = "none";
  document.querySelector("main").style.paddingBottom = "24px";
}

// Orb reacts while the person edits the form
let draftTimer = null;
document.getElementById("prodForm").addEventListener("input", () => {
  if (orb.state === "done" || orb.state === "idle") orb.set("listening");
  clearTimeout(draftTimer);
  draftTimer = setTimeout(() => {
    if (orb.state === "listening") orb.set("idle");
  }, 4000);
});
</script>
